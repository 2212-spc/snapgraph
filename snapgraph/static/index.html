<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SnapGraph</title>
    <script type="module" crossorigin src="/assets/index-CumHnbH1.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-3_PbwgGX.css">
  </head>
  <body>
    <div id="app"></div>
    <script>
      (() => {
        function createButton(className) {
          const button = document.createElement("button");
          button.type = "button";
          button.className = className;
          return button;
        }

        function setExpanded(button, expanded) {
          button.textContent = expanded ? "收回" : "展开";
          button.setAttribute("aria-expanded", expanded ? "true" : "false");
        }

        function setVisible(node, visible) {
          node.style.display = visible ? "" : "none";
        }

        function patchEvidenceBlock(block) {
          if (block.dataset.togglePatched === "true") {
            return;
          }

          const head = block.querySelector(":scope > .evidence-block-head");
          if (!head) {
            return;
          }

          const bodyNodes = Array.from(block.children).filter((node) => node !== head);
          if (!bodyNodes.length) {
            return;
          }

          const actions = document.createElement("div");
          actions.className = "evidence-dom-actions";

          const button = createButton("ghost-button evidence-dom-inline-toggle");
          actions.appendChild(button);
          head.appendChild(actions);

          const siblings = () => Array.from(block.parentElement?.querySelectorAll(":scope > .evidence-block") || []);
          const closeOtherBlocks = () => {
            siblings().forEach((peer) => {
              if (peer === block) {
                return;
              }
              if (peer.tagName.toLowerCase() === "details") {
                peer.open = false;
                const peerButton = peer.querySelector(".evidence-dom-inline-toggle");
                if (peerButton) {
                  setExpanded(peerButton, false);
                }
                return;
              }
              peer.querySelectorAll(":scope > *:not(.evidence-block-head)").forEach((node) => {
                setVisible(node, false);
              });
              const peerButton = peer.querySelector(".evidence-dom-inline-toggle");
              if (peerButton) {
                setExpanded(peerButton, false);
              }
            });
          };

          if (block.tagName.toLowerCase() === "details") {
            block.open = false;
            button.addEventListener("click", (event) => {
              event.preventDefault();
              event.stopPropagation();
              const nextOpen = !block.open;
              if (nextOpen) {
                closeOtherBlocks();
              }
              block.open = nextOpen;
              setExpanded(button, block.open);
            });
            block.addEventListener("toggle", () => {
              setExpanded(button, block.open);
            });
            setExpanded(button, false);
          } else {
            let expanded = false;
            const applyState = () => {
              bodyNodes.forEach((node) => {
                setVisible(node, expanded);
              });
              setExpanded(button, expanded);
            };
            button.addEventListener("click", (event) => {
              event.preventDefault();
              const nextExpanded = !expanded;
              if (nextExpanded) {
                closeOtherBlocks();
              }
              expanded = nextExpanded;
              applyState();
            });
            applyState();
          }

          block.dataset.togglePatched = "true";
        }

        function patchEvidenceSection(section) {
          if (section.dataset.togglePatched === "true") {
            return;
          }

          const head = section.querySelector(":scope > .section-head");
          if (!head) {
            return;
          }

          const bodyNodes = Array.from(section.children).filter((node) => node !== head);
          const button = createButton("paper-button toggle-button evidence-dom-toggle");
          head.appendChild(button);

          let expanded = false;
          const resetChildBlocks = () => {
            section.querySelectorAll(":scope > .evidence-grid > .evidence-block").forEach((block) => {
              if (block.tagName.toLowerCase() === "details") {
                block.open = false;
              } else {
                block.querySelectorAll(":scope > *:not(.evidence-block-head)").forEach((node) => {
                  setVisible(node, false);
                });
              }
              const button = block.querySelector(".evidence-dom-inline-toggle");
              if (button) {
                setExpanded(button, false);
              }
            });
          };
          const update = () => {
            bodyNodes.forEach((node) => {
              setVisible(node, expanded);
            });
            if (!expanded) {
              resetChildBlocks();
            }
            setExpanded(button, expanded);
          };
          button.addEventListener("click", (event) => {
            event.preventDefault();
            event.stopPropagation();
            expanded = !expanded;
            update();
          });
          update();

          section.querySelectorAll(":scope > .evidence-grid > .evidence-block").forEach(patchEvidenceBlock);
          section.dataset.togglePatched = "true";
        }

        function patchRelatedMaterials(section) {
          if (section.dataset.togglePatched === "true") {
            return;
          }

          const head = section.querySelector(":scope > .section-head");
          if (!head) {
            return;
          }

          const bodyNodes = Array.from(section.children).filter((node) => node !== head);
          const button = createButton("paper-button toggle-button materials-dom-toggle");
          head.appendChild(button);

          const resetExpandedMaterials = () => {
            section.querySelectorAll(".source-inline-detail").forEach((detail) => {
              setVisible(detail, false);
            });
            section.querySelectorAll(".source-link-button").forEach((toggle) => {
              if (toggle.textContent && toggle.textContent.includes("收起")) {
                toggle.textContent = "展开材料";
              }
            });
          };

          let expanded = false;
          const update = () => {
            bodyNodes.forEach((node) => {
              setVisible(node, expanded);
            });
            if (!expanded) {
              resetExpandedMaterials();
            }
            setExpanded(button, expanded);
          };

          button.addEventListener("click", (event) => {
            event.preventDefault();
            event.stopPropagation();
            expanded = !expanded;
            update();
          });

          update();
          section.dataset.togglePatched = "true";
        }

        function patch() {
          document.querySelectorAll(".composer-tool-row").forEach((row) => {
            row.remove();
          });
          document.querySelectorAll(".evidence-chain").forEach((section) => {
            patchEvidenceSection(section);
          });
          document.querySelectorAll(".related-materials").forEach((section) => {
            patchRelatedMaterials(section);
          });
        }

        const observer = new MutationObserver(() => patch());
        observer.observe(document.documentElement, { childList: true, subtree: true });

        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", patch, { once: true });
        } else {
          patch();
        }
      })();
    </script>
  </body>
</html>
